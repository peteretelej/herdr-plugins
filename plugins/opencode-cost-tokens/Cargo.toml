[package]
name = "peteretelej-opencode-cost-tokens"
version = "0.1.1"
edition = "2021"
license = "MIT"
description = "Live OpenCode session telemetry per herdr agent pane: context %, last-turn tok/s, session cost, output tokens, and model"

[[bin]]
name = "opencode-cost-tokens"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
rusqlite = { version = "0.40", features = ["bundled"] }
