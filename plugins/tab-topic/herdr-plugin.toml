id = "peteretelej.tab-topic"
name = "Tab Topic"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Name tabs and panes after the agent's live topic (terminal title). Manual names are respected."
platforms = ["linux", "macos"]

# Every entry runs the same idempotent reconcile; the event name is ignored.
# Deliberately NOT subscribed to pane.updated / *.renamed - our own renames
# would re-trigger us.
# Paths are relative to the plugin dir; cargo emits to the workspace root
# target/, two levels up.
[[events]]
on = "pane.agent_status_changed"
command = ["../../target/release/tab-topic", "run"]

[[events]]
on = "pane.agent_detected"
command = ["../../target/release/tab-topic", "run"]

[[events]]
on = "workspace.focused"
command = ["../../target/release/tab-topic", "run"]

# Manual trigger, e.g. `herdr plugin action invoke peteretelej.tab-topic.sync`
[[actions]]
id = "sync"
title = "Reconcile tab topics now"
command = ["../../target/release/tab-topic", "sync"]

[[actions]]
id = "release"
title = "Stop managing labels and forget state"
command = ["../../target/release/tab-topic", "release", "--clear"]
